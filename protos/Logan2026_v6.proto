#VRML_SIM R2025a utf8
# Quadricoptero Logan desenvolvido pela equipe DeltaV drones da POLI-UPE para a competição Eletroquad 2026.
# Customizado para alta fidelidade com os sensores embarcados redundantes da controladora Holybro Pixhawk 6C 
# e a matriz de inércia exata para afinação de PID avançada no SITL ArduPilot.

PROTO Logan2026_v6 [
  field SFVec3f    translation      0 0 0.204
  field SFRotation rotation         0 0 1 0
  field SFString   name             "Logan2026"
  field SFFloat    cameraPosition   1.57
  field MFNode     camera           [
    Camera {
      fieldOfView 0.8
      width 640
      height 480
    }
  ]
  field SFString   controller       "ardupilot_vehicle_controller"
  field MFString   controllerArgs   [
    
    "--motors"
    "motor1, motor2, motor3, motor4"
    "--reversed-motors"
    "3,4"
    "--motor-cap"
    "100"
    "--servos"
    "camera_tilt"
    "--camera"
    "camera"
    "--camera-fps"
    "10"
    "--camera-port"
    "8554"
  
  ]
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    
    children [
      # -----------------------------------------------------------------
      # CHASSIS E ARMAÇÃO VISUAL (DeltaV Logan2026)
      # -----------------------------------------------------------------
      Solid {
        children [
          Transform {
            scale 0.001 0.001 0.001
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0 0 0.4
                  roughness 0.1
                  metalness 0.01
                }
                geometry Mesh {
                  url [
                    "../protos/logan2026/center.stl"
                  ]
                }
              }
            ]
          }
        ]
        name "center"
      }
      
      # Arm 1
      Solid {
        children [
          DEF ARM_SHAPE Transform {
            scale 0.001 0.001 0.001
            children [
              Shape {
                appearance DEF CARBON_FIBER PBRAppearance {
                  baseColor 0.1 0.1 0.1
                  roughness 0.1
                  metalness 0.01
                }
                geometry Mesh {
                  url [
                    "../protos/logan2026/arm.stl"
                  ]
                }
              }
            ]
          }
        ]
        name "arm1"
      }
      
      # Arm 2
      Solid {
        rotation 0 0 1 -1.5707953071795862
        children [
          USE ARM_SHAPE
        ]
        name "arm2"
      }
      
      # Arm 3
      Solid {
        rotation 0 0 1 3.14159
        children [
          USE ARM_SHAPE
        ]
        name "arm3"
      }
      
      # Arm 4
      Solid {
        rotation 0 0 -1 -1.5707953071795862
        children [
          USE ARM_SHAPE
        ]
        name "arm4"
      }

      # -----------------------------------------------------------------
      # PROPELLER / MOTORES CONFIGURAÇÃO QUADRICÓPTERO (SISTEMA DE FORÇA COEFICIENTES)
      # -----------------------------------------------------------------
      
      # Motor 4 (CCW / Anti-horário)
      DEF M4 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.173 -0.173 0.0325
        thrustConstants -0.0009544 0
          torqueConstants 0.000909 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "motor4"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.173 -0.173 0.0325
          children [
            DEF FASTHELIX Shape {
              appearance PBRAppearance {
                baseColor 0.1 0.1 0.1
                baseColorMap ImageTexture {
                  url [
                    "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/default/protos/textures/fast_helix.png"
                  ]
                }
                metalness 0
              }
              geometry DEF HELIX_CYLINDER Cylinder {
                height 0.01
                radius 0.1275
              }
            }
          ]
          boundingObject USE HELIX_CYLINDER
        }
        slowHelix Solid {
          translation -0.173 -0.173 0.0325
          children [
            DEF PROPELLER Transform {
              translation -0.173 -0.173 -0.0325
              scale 0.001 0.001 0.001
              children [
                Shape {
                  appearance PBRAppearance {
                    baseColor 0 0.1 0
                    metalness 0.3
                  }
                  geometry Mesh {
                    url [
                      "../protos/logan2026/propeller.stl"
                    ]
                  }
                }
              ]
            }
          ]
          boundingObject DEF HELIX_BOUNDING Group {
            children [
              Cylinder {
                height 0.02
                radius 0.01
              }
              Box {
                size 0.25 0.03 0.01
              }
            ]
          }
          translationStep 0.0001
        }
      }

      # Motor 1 (CW / Horário)
      DEF M1 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.173 -0.173 0.0325
        thrustConstants 0.0009544 0
        torqueConstants 0.000909 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "motor1"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.173 -0.173 0.0325
          children [
            USE FASTHELIX
          ]
          boundingObject USE HELIX_CYLINDER
        }
        slowHelix Solid {
          translation 0.173 -0.173 0.0325
          children [
            USE PROPELLER
          ]
          boundingObject USE HELIX_BOUNDING
        }
      }

      # Motor 3 (CCW / Anti-horário)
      DEF M3 Propeller {
        shaftAxis 0 0 1
        centerOfThrust 0.173 0.173 0.0325
        thrustConstants -0.0009544 0
        torqueConstants 0.000909 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "motor3"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation 0.173 0.173 0.0325
          children [
            USE FASTHELIX
          ]
          boundingObject USE HELIX_CYLINDER
        }
        slowHelix Solid {
          translation 0.173 0.173 0.0325
          children [
            USE PROPELLER
          ]
          boundingObject USE HELIX_BOUNDING
        }
      }

      # Motor 2 (CW / Horário)
      DEF M2 Propeller {
        shaftAxis 0 0 1
        centerOfThrust -0.173 0.173 0.0325
        thrustConstants 0.0009544 0
        torqueConstants 0.000909 0
        fastHelixThreshold 50
        device RotationalMotor {
          name "motor2"
          maxVelocity 600
          maxTorque 30
        }
        fastHelix Solid {
          translation -0.173 0.173 0.0325
          children [
            USE FASTHELIX
          ]
          boundingObject USE HELIX_CYLINDER
        }
        slowHelix Solid {
          translation -0.173 0.173 0.0325
          children [
            USE PROPELLER
          ]
          boundingObject USE HELIX_BOUNDING
        }
      }

      # -----------------------------------------------------------------
      # CAMERA & GIMBAL SYSTEM (Suporte Ativo de Estabilização)
      # -----------------------------------------------------------------
      Solid {
        translation 0.13 0.003 0
        children [
          HingeJoint {
            jointParameters HingeJointParameters {
              position IS cameraPosition
              axis 0 1 0
            }
            device [
              RotationalMotor {
                name "camera_tilt"
                maxPosition 1.57
              }
            ]
            endPoint Solid {
              rotation 1 0 0 0 
              children [
                Pose {
                  children [
                    Transform {
                      translation -0.13 0 -0.002
                      scale 0.001 0.001 0.001
                      children [
                        Shape {
                          appearance PBRAppearance {
                            baseColor 0.3 0 0
                            roughness 0.1
                            metalness 0.01
                          }
                          geometry Mesh {
                            url [
                              "../protos/logan2026/gimbal.stl"
                            ]
                          }
                        }
                      ]
                    }
                    Pose {
                      translation 0.031 0.0005 -0.002
                      children IS camera
                    }
                  ]
                }
              ]
              name "camera_case"
            }
          }
        ]
        name "gimbal"
      }

      # -----------------------------------------------------------------
      # SENSORES PADRÃO ARDUPILOT (Para uso imediato no SITL)
      # -----------------------------------------------------------------
      Accelerometer {
        lookupTable [
          0 0 0.001,
          9.80665 9.80665 0.000675,
          156.9064 156.9064 0.0000422
        ]
        #resolution 0
      }
      Gyro {
        lookupTable [
          0 0 0.001,
          34.9066 34.9066 0.000014
        ]
        #resolution 0
      }
      InertialUnit {
        noise 0.0025
        #resolution 0.0001
      }
      GPS {
        accuracy 1.5
        noiseCorrelation 0.9
        speedNoise 0.05
      }
      Compass {
        name "compass"
        #lookupTable [
         # -1 -1 0.005,
          #1 1 0.005
       # ]
        #resolution 0
      }

      
    ]

    # -----------------------------------------------------------------
    # ESTRUTURA DE COLISÃO DO DRONE LOGAN
    # -----------------------------------------------------------------
    boundingObject Group {
      children [
        Pose {
          translation 0 0 -0.04
          children [
            Box {
              size 0.2 0.2 0.12
            }
          ]
        }
        Pose {
          translation -0.06 0 0.09
          children [
            Box {
              size 0.05 0.05 0.18
            }
          ]
        }
        Pose {
          translation -0.11 0.11 -0.098
          rotation 0 0 1 2.35619
          children [
            DEF ARM_BOX Box {
              size 0.2 0.025 0.21
            }
          ]
        }
        Pose {
          translation 0.11 0.11 -0.098
          rotation 0 0 1 -2.35619
          children [
            USE ARM_BOX
          ]
        }
        Pose {
          translation 0.11 -0.11 -0.098
          rotation 0 0 1 2.35619
          children [
            USE ARM_BOX
          ]
        }
        Pose {
          translation -0.11 -0.11 -0.098
          rotation 0 0 1 -2.35619
          children [
            USE ARM_BOX
          ]
        }
      ]
    }

    # -----------------------------------------------------------------
    # PARÂMETROS FÍSICOS REAIS DO LOGAN (Para simulação dinâmica precisa)
    # -----------------------------------------------------------------
    physics Physics {
      density -1
      mass 2.810
      centerOfMass [
          0 0 0
      ]
    }
  }
}
